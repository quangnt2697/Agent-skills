description = "Design test artifacts — execution checklist and BDD Gherkin feature files"

prompt = """
Invoke the qa-test-design skill via the test-engineer persona.

/qa runs a two-phase gated workflow to produce test design artifacts.
Do not skip Phase 1 — the checklist is the source of truth for scenario coverage.

## Phase 1 — Checklist

1. Gather requirements from the spec, API docs, or user description
2. Group items by test concern: Security → Routing → Validation → Business Rules → Edge Cases → Happy Path
3. Write each item with an action verb, one-item-one-action, quantified assertions
4. Assign priority (P0/P1/P2) and metadata

Save the checklist as a markdown file and present it to the user for review.
Use `references/qa-testing-checklist.md` as the minimum baseline for financial domain patterns.

## Checkpoint

Present the checklist to the user. Do not proceed to Phase 2 until the user confirms the checklist is complete.

## Phase 2 — BDD Gherkin

Using the approved checklist as input:

5. Map checklist groups to Features — each group typically becomes one .feature file
6. Extract test-specific rules and brainstorm scenarios (pre-flight analysis)
7. Write Feature blocks with user stories and Background
8. Design Scenarios (happy-path mandatory, negative per validation rule)
9. Apply strict Given/When/Then (Arrange/Act/Assert)
10. Use Scenario Outline with BVA for data-driven validation, apply tagging strategy

Save each .feature file alongside the checklist.

## Rules

1. Both checklist and .feature files MUST be written in Vietnamese using domain terminology for securities, fintech, banking, and financial services.
2. Every .feature scenario must trace back to a checklist item.
3. Use `references/qa-testing-checklist.md` for BVA tables, equivalence partitioning, and financial domain validation patterns.
4. Do not generate test implementation code — this command designs test artifacts only. Use /test for TDD implementation.
"""
