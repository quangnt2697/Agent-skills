description = "[BA/PO] Tải Jira issue thành PDF, tự động nhận diện loại task, trích xuất & phân tích yêu cầu, tổng hợp thành *-final.md (Business-Spec)"

prompt = """
Invoke the ba-spec skill. Đọc file SKILL.md để thực hiện đúng workflow.

$ARGUMENTS chứa đầu vào. Agent PHẢI tự nhận diện loại input:

**Luồng Jira** (nếu đầu vào có dạng Issue Key, VD: `PROJ-123`, `G3PTP-16584`):
1. **Phase 0 — Scan & Duyệt**: Gọi API Jira lấy metadata (CHƯA tải PDF). Trích xuất danh sách Confluence pages tham chiếu (từ issuelinks, remotelink, description) + file đính kèm. Kiểm tra cache trong `specs/imports/` xem file nào đã tải trước đó (hiển thị path). Trình bảng danh sách cho user duyệt → DỪNG LẠI chờ "OK".
2. **Phase 1 — Download**: Chỉ tải Jira PDF + các file Confluence/attachment CÒN THIẾU. Lưu vào `workspace/{issueKey}/specs/imports/jira/{issueKey}/source/` và `source/references/`. Tên file Confluence theo quy ước: `{tên-slug}-{pageId}.pdf`.
3. **Phase 1.5 → Phase 5**: Nhận diện loại task → Trích xuất (đọc ĐA NGUỒN: Jira PDF + tất cả references + file đã có sẵn) → Phân tích gaps → Interview-me → Tổng hợp `{issueKey}-final.md`.

**Luồng Confluence** (nếu đầu vào có từ khóa "confluence" hoặc không phải Issue Key):
1. **Phase 1A — Tìm kiếm**: Dùng CQL search Confluence theo keyword → Hiển thị top 5 kết quả → DỪNG LẠI chờ user chọn.
2. **Phase 1B — Scan & Duyệt References**: Quét trang đã chọn tìm link con + attachments → Kiểm tra cache → Trình danh sách duyệt → DỪNG LẠI chờ "OK".
3. **Phase 1C → Phase 5**: Download file thiếu → Phân tích đa nguồn → Tổng hợp `{keyword}-final.md` vào `workspace/{issueKey}/specs/imports/confluence/{keyword}/`.

**Biến môi trường:** Dùng chung Atlassian: `ATLASSIAN_BASE_URL`, `ATLASSIAN_EMAIL`, `ATLASSIAN_API_TOKEN`.
**Bộ lọc file:** Tải: .pdf, .doc, .docx, .xls, .xlsx, .csv, .txt, .md, .png, .jpg, .svg, .webp, .drawio, .json, .yaml, .sql. Bỏ qua: video (.mp4), file nén (.zip, .rar).
**Quy ước tên file Confluence:** `{tên-ngắn-gọn-slug}-{pageId}.pdf` (viết thường, bỏ dấu, thay khoảng trắng bằng -, tối đa 50 ký tự phần tên).

LƯU Ý: Tất cả output phải bằng TIẾNG VIỆT. BẮT BUỘC dùng Tool Call để tạo/sửa file trực tiếp.

<critical_instruction>
HÀNH ĐỘNG THAY VÌ CHAT: Bạn có TOÀN QUYỀN sử dụng các công cụ hệ thống (tool call) để trực tiếp Thêm, Sửa, Xóa file. NGHIÊM CẤM COPY-PASTE MANUAL: Tuyệt đối không in ra các khối code (Markdown diff/code blocks) rồi bảo người dùng tự copy/paste. Bắt buộc phải sử dụng Tool Call để trực tiếp áp dụng thay đổi vào mã nguồn.
</critical_instruction>
"""
