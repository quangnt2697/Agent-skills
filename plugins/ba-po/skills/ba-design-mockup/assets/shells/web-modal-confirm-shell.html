<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>Entrade X — Web Modal Confirmation (Prod-Twin Full HD)</title>
  <style>
    :root {
      --bg-backdrop: rgba(0, 0, 0, 0.75);
      --bg-modal: #161b22;
      --border-subtle: #242c37;
      --text-primary: #f0f3f6;
      --text-secondary: #9aa4b2;
      --brand-primary: #1068eb;
      --stock-green: #00d084;
      --delta-added: #00d084;
      --delta-modified: #f59e0b;
      --font-family: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0d11;
      width: 1920px;
      min-width: 1920px;
      min-height: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-family);
      color: var(--text-primary);
    }
    .device-frame {
      width: 1920px;
      min-height: 1080px;
      background: var(--bg-backdrop);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .modal-box {
      width: 480px;
      background: var(--bg-modal);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 15px;
      font-weight: 700;
    }
    .modal-body { padding: 20px; font-size: 13px; display: flex; flex-direction: column; gap: 12px; }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .row { display: flex; justify-content: space-between; }
    [data-change="added"] {
      outline: 2px dashed var(--delta-added);
      outline-offset: 4px;
      border-radius: 4px;
      position: relative;
      background: rgba(0, 208, 132, 0.08);
    }
    [data-change="modified"] {
      outline: 2px dashed var(--delta-modified);
      outline-offset: 4px;
      border-radius: 4px;
      position: relative;
      background: rgba(245, 158, 11, 0.08);
    }
  </style>
</head>
<body>
  <div class="device-frame" id="mockup-canvas">
    <div class="modal-box">
      <div class="modal-header">Xác Nhận Đặt Lệnh Chứng Khoán</div>
      <div class="modal-body">
        <div class="row"><span>Mã Cổ Phiếu:</span><strong>VND (VNDIRECT)</strong></div>
        <div class="row"><span>Loại Lệnh:</span><span style="color: var(--stock-green); font-weight: 700;">MUA (LO)</span></div>
        <div class="row"><span>Khối Lượng:</span><strong>1,000</strong></div>
        <div class="row"><span>Giá Đặt:</span><strong>24,500 đ</strong></div>
        <!-- HIGHLIGHT PHẦN THÊM MỚI: GÓI LÃI SUẤT KÝ QUỸ -->
        <div class="row" data-change="added">
          <span>Gói Ký Quỹ Áp Dụng:</span>
          <strong style="color: var(--stock-green);">Gói T+10 Ưu Đãi (8.9%/năm)</strong>
        </div>
        <div class="row" style="border-top: 1px solid var(--border-subtle); padding-top: 8px;">
          <span>Tổng Giá Trị Lệnh:</span>
          <strong style="font-size: 15px;">24,500,000 đ</strong>
        </div>
      </div>
      <div class="modal-footer">
        <button style="padding: 8px 16px; background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); border-radius: 6px; cursor: pointer;">Hủy</button>
        <button id="btnConfirmOrder" style="padding: 8px 16px; background: var(--brand-primary); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Xác Nhận Đặt Lệnh</button>
      </div>
    </div>
  </div>
  <script>
    function switchState(state) {
      const btn = document.getElementById('btnConfirmOrder');
      if (state === 'error' && btn) {
        btn.textContent = 'Khóa Giao Dịch (Hết Hạn Mức)';
        btn.style.background = '#ef4444';
      } else if (state === 'locked' && btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = 'Đã Khóa Phiên (Không Nhận Lệnh)';
      } else if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.background = 'var(--brand-primary)';
        btn.textContent = 'Xác Nhận Đặt Lệnh';
      }
    }
    window.__MOCKUP_READY__ = true;
  </script>
</body>
</html>
