<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1.0">
  <title>Entrade X App — Mobile BottomSheet OTP Confirmation (Prod-Twin)</title>
  <style>
    :root {
      --bg-surface: #12161c;
      --bg-card: #181d24;
      --bg-input: #0e1217;
      --border-subtle: #242c37;
      --text-primary: #f0f3f6;
      --text-secondary: #9aa4b2;
      --brand-primary: #1068eb;
      --stock-green: #00d084;
      --delta-added: #00d084;
      --font-family: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: var(--font-family);
      color: var(--text-primary);
    }
    .device-frame {
      width: 393px;
      height: 852px;
      background: rgba(0,0,0,0.7);
      border: 10px solid #282d35;
      border-radius: 48px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .bottom-sheet {
      background: var(--bg-surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 1px solid var(--border-subtle);
    }
    .sheet-handle { width: 40px; height: 4px; background: #374151; border-radius: 2px; margin: 0 auto 8px auto; }
    .otp-inputs { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
    .otp-box { width: 42px; height: 48px; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 8px; text-align: center; font-size: 20px; font-weight: 700; color: #fff; line-height: 48px; }
    [data-change="added"] { outline: 2px dashed var(--delta-added); outline-offset: 4px; border-radius: 8px; position: relative; }
    .delta-pin { position: absolute; top: -10px; right: -8px; background: var(--delta-added); color: #000; font-weight: 700; border-radius: 9999px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  </style>
</head>
<body>
  <div class="device-frame" id="mockup-canvas">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div style="font-weight: 700; font-size: 16px; text-align: center;">Xác Thực Smart OTP</div>
      <div style="font-size: 13px; color: var(--text-secondary); text-align: center;">Vui lòng nhập mã OTP 6 số để xác nhận lệnh Mua 1,000 VND</div>
      <!-- [TO-BE DELTA ①] SMART OTP 6 SỐ -->
      <div data-change="added">
        <span class="delta-pin">①</span>
        <div class="otp-inputs">
          <div class="otp-box">1</div>
          <div class="otp-box">8</div>
          <div class="otp-box">9</div>
          <div class="otp-box">9</div>
          <div class="otp-box">•</div>
          <div class="otp-box">•</div>
        </div>
      </div>
      <button id="btnSubmitOtp" style="height: 44px; background: var(--brand-primary); color: #fff; font-weight: 700; border: none; border-radius: 8px; font-size: 14px; cursor: pointer;">Xác Nhận & Gửi Lệnh</button>
    </div>

    <!-- BẢNG CHÚ THÍCH UI DELTA MAPPING -->
    <div class="delta-legend-card" style="width: 390px; margin: 16px auto; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px;">
      <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">📋 Bảng Chú Thích Thay Đổi Giao Diện (UI Delta Mapping)</h3>
      <table class="delta-table" style="width: 100%; border-collapse: collapse; font-size: 12px;">
        <thead>
          <tr style="border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); text-align: left;">
            <th style="padding: 6px;">Badge</th>
            <th style="padding: 6px;">Thành Phần</th>
            <th style="padding: 6px;">Thay Đổi</th>
            <th style="padding: 6px;">Quy Tắc</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="padding: 6px;"><span class="delta-pin" style="position: static; display: inline-flex;">①</span></td>
            <td style="padding: 6px;"><strong>Smart OTP 6 Số</strong></td>
            <td style="padding: 6px;">Thêm mới (Input OTP) - Ô nhập 6 số xác thực lệnh</td>
            <td style="padding: 6px;"><code>[BR-01]</code></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script>
    function switchState(state) {
      const btn = document.getElementById('btnSubmitOtp');
      if (state === 'error' && btn) {
        btn.textContent = 'Mã OTP Không Hợp Lệ (Thử Lại)';
        btn.style.background = '#ef4444';
      } else if (state === 'locked' && btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.textContent = 'Tài Khoản Bị Khóa OTP (Sau 5 Lần Sai)';
      } else if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.background = 'var(--brand-primary)';
        btn.textContent = 'Xác Nhận & Gửi Lệnh';
      }
    }
    window.__MOCKUP_READY__ = true;
  </script>
</body>
</html>
