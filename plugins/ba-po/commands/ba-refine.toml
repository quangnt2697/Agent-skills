description = "Download Jira task có ý tưởng thô/mơ hồ, scan tài liệu liên quan, mài giũa thành spec chi tiết rõ ràng, sau đó push lại lên Jira theo cấu trúc chuẩn"

prompt = """
# Command: ba-refine

Download Jira task → Scan & approve tài liệu → Refine idea (divergent → convergent → sharpen) → Push to Jira

## Usage

```bash
/ba-refine {issueKey}
```

## Arguments

- `{issueKey}` (required) — Jira issue key (VD: PROJ-123, G3PTP-456)

## Examples

```bash
/ba-refine PROJ-123
/ba-refine G3PTP-456
```

## Workflow

```
Phase 0: Scan, Trích xuất Từ khóa & Tổng hợp Danh sách (APPROVAL GATE 1)
    - Chuẩn hóa {issueKey}, lấy metadata Jira qua n8n (prepJiraContext)
    - Trích xuất từ khóa từ Tiêu đề Task (extractedKeywords) & quét JQL/CQL tìm task/Confluence liên quan
    - Nếu có UI: chạy extract-asis-ui.js sinh spec/asis-inventory.json & .md từ nhánh master/main
    - Trình danh sách tài liệu & task liên quan cho user duyệt (Gate 1)
    - CHỜ user approve → Tải file thiếu vào workspace/issues/{issueKey}/source/refs/
    ↓
Phase 1: Khai phóng theo 5 Chiều Nghiệp vụ (Divergent)
    - Đọc TẤT CẢ tài liệu (Jira + Confluence + attachments + Domain rules)
    - Mở rộng ý tưởng theo 5 chiều nghiệp vụ (Who, Why, What Rules, When, User Journey)
    - Làm rõ điểm mù qua ba-interview-me (Confidence ≥ 90%)
    - Sinh 5-8 biến thể ý tưởng nghiệp vụ
    ↓
Phase 2: Phản biện Nghiệp vụ & Tình huống Biên (Convergent)
    - Gom thành 2-3 hướng đi nghiệp vụ rõ ràng
    - Stress-test xung đột quy tắc nghiệp vụ & xử lý ngoại lệ
    - Làm lộ diện các giả định ngầm (Surface hidden assumptions)
    ↓
Phase 3: Chuẩn hóa Đặc tả 5 Mục & Dựng Mockup Prod-Twin (APPROVAL GATE 2)
    - User chọn hướng đi cuối cùng → Tạo refined-draft.md chuẩn 5 phần Jira
    - Viết Acceptance Criteria dạng Gherkin sạch (KHÔNG @tags, KHÔNG [AC-x.y])
    - Nếu có UI: gọi ba-design-mockup dựng Prod-Twin mockup đa trạng thái (mockup-case-1..3.png, Fidelity ≥ 90%)
    - Chạy Hard Gate validate-ba-refine.js → Trình user duyệt (Gate 2) → Chốt refined.md
    ↓
Phase 4: Đồng bộ lên Jira & Handoff Kỹ thuật
    - Cập nhật Jira Description dạng ADF kèm inline image mediaSingle (KHÔNG comment, KHÔNG label)
    - Tự động xuất bản spec/testability-manifest.json bàn giao cho QA
    - Trả về Jira URL & gợi ý handoff sang DEV/QA
```

## Key Features

- **Scan trước, tải sau (Gate 1):** Trích xuất từ khóa tiêu đề, quét Jira/Confluence liên quan → trình danh sách → user approve → tải
- **Multi-source & Cache-aware:** Đọc Jira PDF + Confluence pages + attachments, tái sử dụng file đã tải trong `source/refs/`
- **5 Chiều Nghiệp vụ & Stress-test:** Khai phóng thuần nghiệp vụ (Zero Technical Noise), kiểm định xung đột quy tắc ngành
- **Prod-Twin UI Mockup (`ba-design-mockup`):** Bóc tách AS-IS từ codebase, dựng Delta-Only kèm huy hiệu `① ② ③`, kiểm định `validate-mockup-fidelity.js` (Fidelity ≥ 90%)
- **Hard Gate & Clean Gherkin (Gate 2):** Kiểm định cấu trúc 5 mục qua `validate-ba-refine.js` trước khi trình duyệt và push Jira

## Output

- **Local spec:** `workspace/issues/{issueKey}/spec/refined.md` (kèm `refined-draft.md`)
- **UI & Testability artifacts:** `workspace/issues/{issueKey}/spec/asis-inventory.*`, `spec/diagrams/mockup-case-*.png`, `spec/testability-manifest.json`
- **Local references:** `workspace/issues/{issueKey}/source/refs/` (Confluence + attachments)
- **Jira:** Updated description dạng ADF chuẩn kèm inline mockup images (KHÔNG comment, KHÔNG label)
- **Confidence level:** ≥90% required for handoff

## Next Steps (Chỉ gợi ý cho người dùng, CẤM tự ý kích hoạt)

Sau khi refinement hoàn tất, hiển thị gợi ý cho user:
- `/qa-test-design {issueKey}` — Thiết kế test cases và checklist
- `/dev-tech-spec {issueKey}` — Viết tech spec kiến trúc

## 🔒 Scope Boundaries & Immutable Hard Stops (Bắt buộc tuân thủ 100%)

1. **CHỈ LÀM (TIER 2 - ARTIFACT-ONLY):** Lệnh này CHỈ làm nhiệm vụ refine đặc tả nghiệp vụ, dựng mockup Delta-Only và cập nhật lên Jira Description theo phê duyệt qua 2 Approval Gates.
2. **TUYỆT ĐỐI CẤM (STRICT FORBIDDEN):** 
   - TUYỆT ĐỐI CẤM viết code application, viết mã test tự động, hoặc can thiệp file ngoài thư mục `workspace/issues/{issueKey}/`.
   - CẤM tự ý sửa đổi đặc tả để lách cổng kiểm định `validate-ba-refine.js`.
3. **ĐIỀU KIỆN DỪNG (HARD STOP):** Sau khi hoàn tất cập nhật Jira và xuất `testability-manifest.json`, DỪNG LẠI NGAY và bàn giao. CẤM tự ý chạy các lệnh trong Next Steps.

## Related

- `/ba-spec` — Import & analyze Jira (for clear requirements)
- `/ba-interview` — Interview stakeholders
- `/ba-gap-analysis` — Find gaps in requirements

## Requirements

`.env` file với Jira credentials:
```
ATLASSIAN_BASE_URL=https://your-domain.atlassian.net
ATLASSIAN_EMAIL=your-email@company.com
ATLASSIAN_API_TOKEN=your-api-token
```
