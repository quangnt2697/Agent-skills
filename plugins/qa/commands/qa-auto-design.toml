prompt = """
Kích hoạt skill qa-auto-design. Đọc file SKILL.md của skill qa-auto-design để thực hiện đúng workflow 7 bước.

$ARGUMENTS chứa Jira issue key (VD: G3PTP-16825).

## Nguồn đầu vào

1. **File .feature:** `/project-root/workspace/{issueKey}/test/{issueKey}.feature`
2. **File checklist:** `/project-root/workspace/{issueKey}/test/checklist.md`
3. **File spec (nếu có):** `/project-root/workspace/{issueKey}/spec/final.md`
4. **Code function có sẵn** trong workspace do dev team phát triển — tìm và tái sử dụng

## Quy trình

1. Bước 0: Áp dụng Blueprint cấu trúc thư mục chuẩn tại `/project-root/workspace/{issueKey}/test/`
2. Bước 1: Nhận diện Task Type từ file .feature hoặc spec
3. Bước 2: Đối chiếu Checklist ↔ Gherkin (Quality Gate) & Kế thừa env 3 tầng (dò quét Root + Sibling task)
4. Bước 3: Phân tích & Recon — tìm code có sẵn của dev để tái sử dụng
5. Bước 4-5: Thiết kế POM/Service + Sinh code test (import code dev, cấu hình pytest.ini pythonpath)
6. Bước 6: Review code tự động (Quality Gate)
7. Bước 7: Chạy pytest smoke verification + xuất báo cáo Markdown

## Output

- Test scripts: `/project-root/workspace/{issueKey}/test/steps/test_*.py`
- Báo cáo: `/project-root/workspace/{issueKey}/test/result/report.md`

## Quy tắc

1. BẮT BUỘC tuân thủ Blueprint cấu trúc thư mục chuẩn tại `workspace/{issueKey}/test/`, TUYỆT ĐỐI KHÔNG tự nghĩ ra file/thư mục lạ ngoài blueprint.
2. BẮT BUỘC áp dụng cơ chế kế thừa env 3 tầng (Root → Sibling Task cùng loại → Task local), tái sử dụng credentials (`api-key`, `api-secret`, `token`, URLs) mà không bắt user nhập lại.
3. BẮT BUỘC tìm và tái sử dụng code API/WebSocket có sẵn của dev. KHÔNG viết lại từ đầu.
4. Nếu file `.feature` chưa tồn tại, yêu cầu user chạy `/qa-test-design` trước.
5. Tất cả output viết bằng TIẾNG VIỆT (trừ code và tags).

