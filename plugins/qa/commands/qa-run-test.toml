description = "Chỉ chạy test automation đã có sẵn và xuất báo cáo kết quả. Không sinh code mới."

prompt = """
CHỈ thực thi test scripts đã có sẵn và xuất báo cáo. KHÔNG sinh code automation mới.

$ARGUMENTS có thể chứa Jira issue key (VD: G3PTP-16825), đường dẫn thư mục, file test cụ thể, hoặc marker pytest.

## Quy trình Thực thi

1. **Phân giải Mục tiêu Chạy & Pre-flight Check:**
   - **Xác định target:**
     - Nếu $ARGUMENTS chỉ định file hoặc thư mục cụ thể → Chạy trực tiếp target đó.
     - Nếu có `{issueKey}` → Target mặc định: `/project-root/workspace/{issueKey}/test/steps/`.
     - Nếu không có → Quét tìm thư mục `steps` hoặc `tests` gần nhất trong workspace.
   - **Nhận diện test files:** Khớp cả hai chuẩn `test_*.py` và `*_test.py`.
   - **Pre-flight Check:** Kiểm tra `pytest`, file cấu hình runtime (`.env`), đảm bảo thư mục kết quả `/project-root/workspace/{issueKey}/test/result/` được tạo sẵn và dọn dẹp các file rác cũ.

2. **Thực thi Test Suite:**
   - Chạy test suite với cấu hình ghi Full Log và hỗ trợ cả 2 chuẩn file:
     ```bash
     HTML_FLAG=""
     python3 -c "import pytest_html" 2>/dev/null && HTML_FLAG="--html=$REPORT_DIR/report.html --self-contained-html"

     pytest "$TEST_TARGET" \
       -o python_files="test_*.py *_test.py" \
       -v -s \
       -o log_cli=true -o log_cli_level=INFO \
       -rA --tb=short \
       --junitxml="$REPORT_DIR/junit.xml" \
       $HTML_FLAG \
       2>&1 | tee "$REPORT_DIR/test-output.log"
     ```
   - **Cờ cốt lõi:** `-s` (không nuốt log), live logging, `-rA` (tổng kết mọi test), và chuyển hướng `2>&1 | tee` vào DUY NHẤT 1 file `test-output.log`.

3. **Self-fix Loop Kỹ thuật Script (Tối đa 3 vòng):**
   - Nếu pytest crash hoặc test fail do lỗi kỹ thuật script (`ImportError`, `SyntaxError`, thiếu fixture, timeout chờ mạng quá ngắn) → Tự sửa script/fixture → Chạy lại (tối đa 3 lần).
   - **Anti-cheating Rules:** Tuyệt đối KHÔNG sửa assertion, KHÔNG skip/comment test case, KHÔNG làm sai lệch mock data để ép test pass.

4. **Phân tích Kết quả & Bóc tách Lỗi:**
   - Đọc kết quả từ `test-output.log` và `junit.xml`.
   - Phân loại lỗi: Application Bug (P0/P1) vs Script Error (P2) vs Environment (P2) vs Flaky (P2).
   - Với test API/WebSocket thất bại: BẮT BUỘC trích xuất Request (Method, URL, Headers, Payload) và Response (Status Code, Body) kèm Root Cause.

5. **Xuất Báo cáo Độc bản & Trình bày cho User:**
   - Ghi báo cáo chính thức vào DUY NHẤT một file `/project-root/workspace/{issueKey}/test/result/report.md` gồm:
     - Bảng tổng kết: Total / Passed / Failed / Skipped / Thời gian / Pass Rate.
     - Chi tiết từng test case Failed (kèm Request/Response API/WS, Root Cause và Đề xuất Fix).
     - Danh sách test cases Passed (rút gọn).
     - Action Items theo độ ưu tiên (P0/P1/P2) cho DEV và QA.
   - Trình bày tóm tắt kết quả Pass/Fail và link file báo cáo cho user.

## Quy tắc Bắt buộc

1. KHÔNG sinh code test mới — chỉ tìm và chạy code đã có.
2. KHÔNG đọc lan man toàn bộ tài liệu spec/checklist/POM trước khi chạy. Chỉ đọc ngược spec khi test fail để phân tích bug.
3. KHÔNG sửa assertion/logic để ép FAIL→PASS — test FAIL do bug ứng dụng là kết quả hợp lệ cần báo cáo.
4. CHỈ sửa lỗi kỹ thuật script (import sai, fixture thiếu, syntax error, timeout chờ...).
5. Output báo cáo bằng TIẾNG VIỆT.
6. Test API/WebSocket BẮT BUỘC in Request và Response trong báo cáo.
7. **ĐỘC BẢN OUTPUT (BẮT BUỘC):** Sau khi chạy xong, trong thư mục kết quả chỉ sinh ra DUY NHẤT 1 file mỗi loại: đúng 1 file XML (`junit.xml`), 1 file HTML (`report.html` nếu có pytest-html), 1 file LOG (`test-output.log`), 1 file MD (`report.md`). Tuyệt đối KHÔNG sinh trùng 2 file cùng loại (cấm sinh đồng thời `{issueKey}-test-report.md` và `report.md`).
8. **FULL CHI TIẾT LOG:** File `test-output.log` BẮT BUỘC ghi lại chi tiết full log toàn bộ console stdout/stderr (không nuốt log, đầy đủ request/response payloads, logs từ test methods).

<critical_instruction>
HÀNH ĐỘNG THAY VÌ CHAT: Bạn có TOÀN QUYỀN sử dụng các công cụ hệ thống (tool call) để trực tiếp Thêm, Sửa, Xóa file. NGHIÊM CẤM COPY-PASTE MANUAL: Tuyệt đối không in ra các khối code (Markdown diff/code blocks) rồi bảo người dùng tự copy/paste. Bắt buộc phải sử dụng Tool Call để trực tiếp áp dụng thay đổi vào mã nguồn.
</critical_instruction>
"""
