description = "Chạy full QA pipeline tự động từ test design đến execution (tự kích hoạt ba-spec nếu chưa có final.md)"

prompt = """
Kích hoạt kỹ năng `qa-full-pipeline` với `$ARGUMENTS`.

Đây là **orchestrator QA chuẩn** của repo. Toàn bộ quy trình, cổng chuyển phase,
xử lý lỗi và resume nằm trong `plugins/qa/skills/qa-full-pipeline/SKILL.md` — đọc file đó
và làm theo, không tự diễn giải lại ở đây.

## Quy Trình Tích Hợp Tự Động

1. **Kiểm tra Spec Đầu Vào (`workspace/issues/{issueKey}/spec/final.md`):**
   - Nếu **ĐÃ CÓ**: Chuyển ngay sang Phase 1 (`qa-test-design`).
   - Nếu **CHƯA CÓ**: Tự động kích hoạt Phase 0 (`ba-spec {issueKey}`) để import Jira/Confluence và tạo `workspace/issues/{issueKey}/spec/final.md` trước khi tiến hành thiết kế test.

2. **Phase 1-4 — QA Pipeline:**
   - Phase 1: `qa-test-design` → checklist kiểm thử và kịch bản Gherkin (.feature).
   - Phase 2: `qa-auto-design` → sinh test code tự động (Playwright/Pytest) theo SDK map.
   - Phase 3: `qa-run-test` → thực thi test và ghi nhận kết quả.
   - Phase 4: Tổng hợp báo cáo Passed/Failed và ma trận truy vết.

## Cú pháp

```bash
# Mặc định: chạy thẳng từ đầu đến cuối, không dừng
/qa-full-pipeline {issueKey}

# Dừng sau mỗi phase để review (opt-in)
/qa-full-pipeline {issueKey} --step

# Resume từ phase cụ thể
/qa-full-pipeline {issueKey} --resume=phase2

# Chỉ thiết kế test, không sinh automation
/qa-full-pipeline {issueKey} --no-automation

# Xem trước, không thực thi
/qa-full-pipeline {issueKey} --dry-run
```

| Cờ | Ý nghĩa |
|---|---|
| _(không cờ)_ | Chạy tự động xuyên suốt — đây là mặc định |
| `--step` | Dừng sau mỗi phase chờ user review |
| `--resume=<phase>` | Bắt đầu từ `phase1` / `phase2` / `phase3` |
| `--no-automation` | Dừng sau Phase 1 (chỉ test thủ công) |
| `--no-squash` | Bỏ qua bước đẩy lên Squash TM |
| `--dry-run` | In kế hoạch, không thực thi |

## Đầu ra

```
workspace/issues/{issueKey}/
├── spec/final.md                    # (Phase 0 nếu tự kích hoạt ba-spec)
└── test/
    ├── checklist.md
    ├── {issueKey}.feature
    ├── steps/test_*.py
    └── result/summary.md
```

## Xem thêm

- `plugins/qa/skills/qa-full-pipeline/SKILL.md` — quy trình đầy đủ (nguồn sự thật)
- `plugins/qa/skills/qa-full-pipeline/references/pipeline-states.md` — sơ đồ trạng thái
- `/e2e-delivery` — pipeline SDLC đầy đủ (BA → DEV → QA)
- `${AGENT_SKILLS_HOME:-.}/.agents/rules/autonomy-contract.md` — cổng dừng/chạy tiếp

## 🔒 Scope Boundaries & Immutable Hard Stops (Bắt buộc tuân thủ 100%)

1. **CHỈ LÀM (TIER 3 - PIPELINE ORCHESTRATOR):** Lệnh này điều phối chuỗi QA Pipeline theo đúng các phase tuần tự được định nghĩa trong SKILL.md.
2. **TUYỆT ĐỐI CẤM (STRICT FORBIDDEN):** 
   - TUYỆT ĐỐI CẤM tự ý sửa đổi code ứng dụng sản phẩm (`src/`, `app/`).
   - CẤM commit hoặc merge vào main khi chưa có sự phê duyệt của người dùng.
3. **ĐIỀU KIỆN DỪNG (HARD STOP):** Hoàn tất Phase 4 và xuất bản báo cáo tổng kết xong, DỪNG LẠI NGAY và xuất trình kết quả.
"""
