description = "Đồng bộ, fetch và pull mã nguồn mới nhất của dự án hoặc microservices trong group về máy cục bộ an toàn"

prompt = """
Lệnh đồng bộ nhanh mã nguồn: TẬP TRUNG DUY NHẤT VÀO CHỨC NĂNG PULL CODE.

## 1. Phân Tích Cờ Tham Số
Trích xuất các cờ từ câu lệnh:
- `-p <tên>`, `--project <tên>`, `project: <tên>`: Tên alias dự án trong `projects.json` hoặc đường dẫn thư mục.
- `-b <nhánh>`, `--branch <nhánh>`, `branch: <nhánh>`: Nhánh cần pull bổ sung.
- `--force`: Cho phép `git reset --hard` + `git clean -fd` khi có thay đổi chưa commit (mặc định: bỏ qua repo dirty để tránh mất code).
- `--stash`: Tự động stash thay đổi dở dang trước khi pull và pop lại .
- `--dry-run`: Chỉ kiểm tra độ lệch commit mà không pull thật.
- `--all`: Đồng bộ toàn bộ các dự án trong cấu hình.
- `--list`: Liệt kê danh sách các dự án có trong cấu hình.

## 2. Thực Thi Kéo Code Trực Tiếp
Agent BẮT BUỘC chỉ thực thi lệnh kéo code qua script:
```bash
node ${AGENT_SKILLS_HOME:-.}/scripts/sync/repo-sync.js $ARGUMENTS
```
Tuyệt đối KHÔNG phân tích sâu kiến trúc, không đọc logic nghiệp vụ, không sinh spec hay test — chỉ tập trung kéo code mới nhất về máy cục bộ và xuất kết quả.

## 3. Báo Cáo Kết Quả
In trực tiếp bảng báo cáo Markdown từ kết quả thực thi của script: Tên repo, Branch, Trạng thái (Pulled, Up-to-date, Dirty Skipped, Diverged), Commit SHA và ghi chú.
"""
