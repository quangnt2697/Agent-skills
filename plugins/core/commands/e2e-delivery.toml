description = "Chạy full end-to-end delivery pipeline từ Jira issue đến code + test hoàn chỉnh. Bao gồm cả QA và DEV workflows — ba-spec → tech-spec → plan → build → qa-test → review → report."

prompt = """
Thực hiện **end-to-end delivery** cho $ARGUMENTS (Jira issue key), bao gồm cả QA/BA và DEV workflows trong 1 pipeline duy nhất.

## Tổng quan

Command này orchestrate cả 2 personas (QA/BA và DEV) để deliver một feature hoàn chỉnh từ Jira issue đến production-ready code + tests.

**Input:** Jira Issue Key (VD: JIRA-123)

**Output:**
- ✅ Business Spec analyzed
- ✅ Tech Spec designed
- ✅ Implementation plan
- ✅ Code implemented
- ✅ QA test cases designed
- ✅ Automation tests written + passed
- ✅ Code reviewed
- ✅ Ready for merge

## Pipeline Flow (8 Phases — 2 track song song)

```
Phase 1:  ba-spec                    [BA/PO] Import & analyze Jira → spec/final.md
   │
   ├──────────── DEV track ─────────────┐   ┌──────── QA track ────────┐
   │ Phase 2: tech-spec        [DEV]    │   │ Phase 7a-7b: test design │
   │ Phase 3: trace-check.js   [script] │   │  (chỉ cần final.md)      │
   │ Phase 4: plan             [DEV]    │   │  --no-automation         │
   │ Phase 5: build + TDD      [DEV]    │   └──────────────────────────┘
   │ Phase 6: verify unit test [script] │
   └─────────────────┬──────────────────┘
                     ▼   (chờ cả 2 track xong)
Phase 7c-7e: automation → run test → trace-check.js --stage=all   [QA]
   ↓
Phase 8:  review                     [DEV+QA] Final review — cổng người trước merge
```

**Song song hoá:** test design (7a-7b) chỉ phụ thuộc `final.md`, nên chạy cùng lúc với DEV track
thay vì đợi build xong. Sau Phase 1, gọi **2 subagent trong CÙNG một lượt Agent tool**:
- `agent-skills:dev` — Phase 2 → 6 (prompt: issueKey + đường dẫn `final.md`, trả về đường dẫn artifact)
- `agent-skills:qa` — `/qa-full-pipeline {issueKey} --no-automation --no-squash`

Hai track ghi vào thư mục khác nhau (`tech/` vs `test/`) nên không xung đột.
Khi cả hai xong, chạy `/qa-full-pipeline {issueKey} --resume=phase2` cho 7c-7e.

**Phase chỉ cơ học → script, không dùng LLM:** Phase 3 và 7e dùng `trace-check.js`,
Phase 6 chỉ chạy lại test suite (TDD đã viết test trong Phase 5).

## Cú pháp

```bash
# Mặc định: chạy xuyên suốt 8 phase, không dừng
/e2e-delivery {issueKey}

# Dừng sau mỗi phase để review (opt-in)
/e2e-delivery {issueKey} --step
```

| Cờ | Ý nghĩa |
|---|---|
| _(không cờ)_ | Chạy tự động xuyên suốt — đây là mặc định |
| `--step` | Dừng sau mỗi phase chờ user review |

Bộ cờ giống hệt `/qa-full-pipeline` và `/qa-pipeline`. Cú pháp
`--mode semi-auto|full-auto|manual` cũ **không còn dùng**.

**Chỉ dừng luồng** khi rơi vào một trong 5 trường hợp của
`${AGENT_SKILLS_HOME:-.}/.agents/rules/autonomy-contract.md` — trong đó phase 8 (trước khi merge vào
`main`) là cổng người bắt buộc theo `${AGENT_SKILLS_HOME:-.}/.agents/rules/git-workflow.md`.
Confidence Level chỉ dùng để báo cáo, không chặn luồng.

## Detailed Phase Breakdown

### Phase 1: ba-spec (QA/BA) — Import & Analyze Jira

**Invoke:** `ba-spec JIRA-123`

**Output:**
- `/project-root/workspace/JIRA-123/spec/final.md`
- Confidence level

**Gate Check:**
- File `final.md` tồn tại và không rỗng → Continue
- Ghi nhận Confidence level vào báo cáo (không chặn luồng)
- Nếu có câu hỏi 🔴 Critical thay đổi bản chất nghiệp vụ → Dừng hỏi user theo `autonomy-contract.md` mục 2.3

---

### Phase 2: dev-spec-driven-development (DEV) — Tech Spec

**Invoke:** `dev-spec-driven-development`

**Input:** Business-Spec từ Phase 1

**Output:**
- `/project-root/workspace/JIRA-123/tech/tech-spec.md`
- Architecture decisions
- API contracts
- Data models
- Confidence level

**Gate Check:**
- File `tech-spec.md` tồn tại và không rỗng → Continue
- Ghi nhận Confidence level vào báo cáo (không chặn luồng)

---

### Phase 3: Traceability Check #1 (script — không dùng LLM)

**Invoke:**
```bash
node ${AGENT_SKILLS_HOME:-.}/plugins/core/skills/meta-cross-validation/scripts/trace-check.js \
  workspace/JIRA-123 --stage=tech
```

**Output:** `/project-root/workspace/JIRA-123/trace/matrix.md` (BR/AC → Tech-Spec, khớp mã chính xác)

**Gate Check (theo exit code):**
- `0` (≥ 90%) → Continue
- `1` (< 90%) → DEV bổ sung mã BR/AC còn thiếu vào Tech-Spec (≤ 3 vòng), chạy lại script, rồi Continue
- `2` (final.md không có mã BR/AC) → ghi gap vào `trace/gaps.md`, Continue — không đoán bằng keyword

---

### Phase 4: dev-planning-and-task-breakdown (DEV) — Plan

**Invoke:** Skill `dev-planning-and-task-breakdown`

**Input:** Tech-Spec từ Phase 2

**Output:**
- `/project-root/workspace/JIRA-123/tech/plan.md`
- Task list với dependencies

**Gate Check:**
- Always continue (planning phase rarely blocks)

---

### Phase 5: dev-incremental-implementation (DEV) — Build

**Invoke:** `/dev-build auto`

**Input:**
- Plan từ Phase 4
- Tech-Spec từ Phase 2

**Output:**
- Application code + unit test (viết theo vòng TDD của `/dev-build`) trong feature branch
- Chưa commit — commit 1 lần sau khi user approve ở Phase 8

**Gate Check:**
- If build success + no syntax errors → Continue
- If build fails → Tự sửa lỗi và chạy lại (tối đa 3 vòng, sau đó STOP báo lỗi)

---

### Phase 6: Verify Unit Tests (không sinh test mới)

`/dev-build` đã chạy vòng TDD ở Phase 5, nên Phase 6 **chỉ chạy lại toàn bộ test suite** của dự án
(`pytest` / `npm test` …) để bắt regression — không gọi `dev-test-driven-development` lần nữa.

**Output:** Kết quả test suite + coverage report (nếu dự án có cấu hình)

**Gate Check:**
- All tests pass → Continue
- If tests fail → Tự debug và sửa (tối đa 3 vòng theo `autonomy-contract.md`)

---

### Phase 7: qa-full-pipeline (QA) — Full QA Workflow

**Invoke:**
- 7a-7b: chạy song song với DEV track — `/qa-full-pipeline {issueKey} --no-automation --no-squash`
- 7c-7e: sau khi DEV track xong — `/qa-full-pipeline {issueKey} --resume=phase2`
- Truyền tiếp `--step` nếu có

**Input:** Business-Spec từ Phase 1 (7a-7b); code từ Phase 5 (7c-7e)

**Includes 5 sub-phases:**
- Phase 7a: Test Design (Checklist + Gherkin)
- Phase 7b: [CỔNG TỰ ĐỘNG] Kiểm tra checklist + P0 + không có [Blocked] → chạy tiếp
- Phase 7c: Test Automation (Generate test code)
- Phase 7d: Test Execution (Run tests + report)
- Phase 7e: Final Traceability Check (`trace-check.js --stage=all` — BR → Tech-Spec → Tests)

**Output:**
- `/project-root/workspace/JIRA-123/test/checklist.md`
- `/project-root/workspace/JIRA-123/test/JIRA-123.feature`
- `/project-root/workspace/JIRA-123/test/steps/test_*.py`
- `/project-root/workspace/JIRA-123/test/result/summary.md`
- `/project-root/workspace/JIRA-123/trace/matrix.md` (end-to-end traceability)

**Gate Check:**
- If pass rate ≥ 90% AND `trace-check.js` exit 0 → Continue
- If pass rate < 90% → tự debug (≤ 3 vòng theo `autonomy-contract.md`), vẫn < 90% → STOP báo cáo
  - Re-run → `/qa-full-pipeline JIRA-123 --resume=phase3`
- If `trace-check.js` exit 1 → bổ sung scenario cho mã thiếu (≤ 3 vòng), vẫn thiếu → STOP báo cáo

**Why consolidated:**
- Old layout had Phases 7-10 as separate steps; now unified into `/qa-full-pipeline`
- Reduces context switches (1 command vs 4)
- Auto-handles gates and resume logic
- Traceability check embedded as sub-phase 7e

---

### Phase 8: review (DEV + QA) — Final Review

**Invoke:** `/cr-review` với persona=dev, sau đó persona=qa

**Input:** All code từ Phase 5, 6, 7 + traceability matrix từ Phase 7e

**Output:**
- Code review report
- List of findings (bugs, improvements)

**Gate Check:**
- If 0 critical findings → DONE ✅
- If has critical findings → fix, re-review (tối đa 3 vòng), vẫn còn → STOP báo cáo
- Phase 8 là cổng người bắt buộc theo `${AGENT_SKILLS_HOME:-.}/.agents/rules/git-workflow.md` (trước khi merge)

