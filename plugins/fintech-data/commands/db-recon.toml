description = "Quét và đối chiếu độ lệch dữ liệu TimescaleDB Production giữa các bảng V3, V2 và Raw cho 11 topic MDDS"

prompt = """
/db-recon kích hoạt quy trình quét và đối chiếu độ lệch dữ liệu (Data Reconciliation & Parity Check) trên TimescaleDB Production (${METABASE_PROD_DB_TIMESCALE_ID}).

## 1. Phạm Vi Áp Dụng
- **Database:** TimescaleDB Production (DB ID: `${METABASE_PROD_DB_TIMESCALE_ID}`) qua Metabase Production (`${METABASE_PROD_URL}`).
- **Phạm vi topic:** 11 topic MDDS theo kiến trúc KRX (Ticks, Trade Extra, TopPrice, Expected Price, OHLC, Indices, Board Events, Symbol Board Events, Foreign Trading, Security Definition, Circuit Breaker / VI).
- **Tuyệt đối loại trừ:** 100% các bảng OpenAPI (chỉ tập trung vào TimescaleDB).
- **An toàn tuyệt đối:** 100% Read-Only (chỉ cho phép SELECT/WITH, cấm DDL/DML/LOCK).

## 2. Cách Chạy Lệnh
Agent hoặc người dùng có thể thực thi thông qua CLI script `node ${AGENT_SKILLS_HOME:-.}/scripts/db/db-recon.js`:

```bash
# Xem danh sách tất cả các query đối chiếu có sẵn
npm run db:recon:prod -- --list

# Chạy Dashboard tổng quan đối chiếu 11 topic cho ngày giao dịch gần nhất
npm run db:recon:prod -- master-dashboard --date YYYY-MM-DD

# Chạy đối chiếu theo từng topic cụ thể
npm run db:recon:prod -- recon-ticks --date YYYY-MM-DD --symbol SSI
npm run db:recon:prod -- recon-topprice --date YYYY-MM-DD --symbol SSI
npm run db:recon:prod -- recon-expected-price --date YYYY-MM-DD
npm run db:recon:prod -- recon-ohlc --date YYYY-MM-DD --symbol HPG
npm run db:recon:prod -- recon-foreign-trading --date YYYY-MM-DD
npm run db:recon:prod -- recon-missing-symbols --date YYYY-MM-DD

# Chạy bộ 4 câu query đối chiếu lõi (Core Suite: Ticks, TopPrices, Ticks Extra)
npm run db:recon:core -- --date YYYY-MM-DD
```

## 3. Quy Trình Phân Tích Độ Lệch
1. **Lấy dữ liệu:** Chạy query đối chiếu tương ứng với topic đang quan tâm.
2. **Đánh giá Trạng thái Khớp (Status):**
   - `MATCH` (Khớp hoàn toàn 100%): Dữ liệu V3 và V2/Raw nhất quán.
   - `MISMATCH` (Lệch số lượng hoặc giá trị): Phân tích nguyên nhân (độ trễ streaming, bộ lọc filter lô lẻ/lô chẵn, cờ hủy lệnh, v.v.).
   - `MISSING` (Thiếu bản ghi ở 1 bên): Xác định mã chứng khoán hoặc khung giờ bị thiếu.
3. **Báo cáo:** Trình bày kết quả dưới dạng bảng Markdown so sánh chi tiết, chỉ ra rõ mã chứng khoán hoặc thời điểm xuất hiện độ lệch vào `workspace/adhoc/database/recon-report.md`.

## 🔒 Scope Boundaries & Immutable Hard Stops (Bắt buộc tuân thủ 100%)

1. **CHỈ LÀM (TIER 1 - READ-ONLY):** Lệnh này CHỈ làm nhiệm vụ chạy các query đối chiếu đọc dữ liệu (SELECT/WITH) và xuất báo cáo so sánh độ lệch.
2. **TUYỆT ĐỐI CẤM (STRICT FORBIDDEN):** TUYỆT ĐỐI CẤM chạy bất kỳ câu lệnh nào làm thay đổi dữ liệu (INSERT, UPDATE, DELETE, DROP, ALTER, TRUNCATE) trên database TimescaleDB/Metabase. CẤM gọi tool sửa đổi file mã nguồn dự án.
3. **ĐIỀU KIỆN DỪNG (HARD STOP):** Sau khi in bảng kết quả đối chiếu, DỪNG LẠI NGAY và bàn giao cho người dùng. CẤM tự ý sửa dữ liệu.
"""
